<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PC Shop{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
  <div class="max-w-6xl mx-auto px-4 py-8">
    <header class="flex flex-col md:flex-row items-center justify-between gap-6 mb-10">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-200 border border-indigo-500">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        </div>
        <div>
          <span class="text-2xl font-black tracking-tighter text-slate-900 uppercase italic">PC<span class="text-indigo-600">Shop</span></span>
          <p class="text-[10px] font-mono text-slate-400 font-bold leading-none uppercase tracking-widest mt-1">v2.0_stable</p>
        </div>
      </div>

      <nav class="flex items-center p-1.5 bg-white border border-slate-200 rounded-2xl shadow-sm overflow-x-auto max-w-full">
        <a class="px-4 py-2 rounded-xl text-xs font-bold transition-all hover:text-indigo-600 font-mono italic {% if request.resolver_match.url_name == 'inventory_list' %}bg-slate-100 text-indigo-600 shadow-inner{% endif %}" href="{% url 'inventory_list' %}">Склад</a>
        
        <a class="px-4 py-2 rounded-xl text-xs font-bold transition-all hover:text-indigo-600 font-mono italic {% if 'build' in request.resolver_match.url_name %}bg-slate-100 text-indigo-600 shadow-inner{% endif %}" href="{% url 'build_list' %}">Сборки</a>
        
        <a class="px-4 py-2 rounded-xl text-xs font-bold transition-all hover:text-indigo-600 font-mono italic {% if 'consumable' in request.resolver_match.url_name %}bg-slate-100 text-indigo-600 shadow-inner{% endif %}" href="{% url 'consumable_list' %}">Кастомы</a>
        
        <a class="px-4 py-2 rounded-xl text-xs font-bold transition-all hover:text-indigo-600 font-mono italic {% if 'sale' in request.resolver_match.url_name %}bg-slate-100 text-indigo-600 shadow-inner{% endif %}" href="{% url 'sale_list' %}">Продажи</a>
        
        <div class="w-px h-4 bg-slate-200 mx-2"></div>
        
        <a class="px-4 py-2 rounded-xl text-xs font-bold transition-all hover:text-indigo-600 font-mono italic {% if 'archive' in request.resolver_match.url_name %}bg-slate-100 text-indigo-600 shadow-inner{% endif %}" href="{% url 'archive_list' %}">Архив</a>
      </nav>
    </header>

    {% include "_messages.html" %}

    <main class="min-h-[60vh]">
      {% block content %}{% endblock %}
    </main>

    <footer class="mt-20 pt-8 border-t border-slate-200">
      <div class="flex justify-between items-center">
        <p class="text-[10px] font-mono text-slate-400 uppercase tracking-widest italic font-bold">Terminal_access_granted // 2026</p>
        <div class="flex gap-4">
          <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
          <span class="text-[10px] font-mono text-slate-300 uppercase font-bold">System_Online</span>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
