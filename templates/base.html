<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PC Upgrade{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
  <div class="max-w-6xl mx-auto px-4 py-8">
    <header class="flex flex-col md:flex-row items-center justify-between gap-6 mb-10">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-200 border border-indigo-500">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <div>
          <span class="text-2xl font-black tracking-tighter text-slate-900 uppercase italic">PC<span class="text-indigo-600">Upgrade</span></span>
          <!-- <p class="text-[10px] font-mono text-slate-400 font-bold leading-none uppercase tracking-widest mt-1">v2.1_stable</p> -->
        </div>
      </div>

      <nav class="flex items-center p-1.5 bg-white border border-slate-200 rounded-2xl shadow-sm overflow-x-auto max-w-full font-mono text-[11px] uppercase font-bold italic">
        <a class="px-4 py-2 rounded-xl transition-all hover:text-indigo-600 {% if request.resolver_match.url_name == 'dashboard' %}bg-slate-100 text-indigo-600 shadow-inner{% endif %}" href="{% url 'dashboard' %}">Аналитика</a>
        
        <a class="px-4 py-2 rounded-xl transition-all hover:text-indigo-600 {% if request.resolver_match.url_name == 'inventory_list' %}bg-slate-100 text-indigo-600 shadow-inner{% endif %}" href="{% url 'inventory_list' %}">Склад</a>
        
        <a class="px-4 py-2 rounded-xl transition-all hover:text-indigo-600 {% if 'build' in request.resolver_match.url_name %}bg-slate-100 text-indigo-600 shadow-inner{% endif %}" href="{% url 'build_list' %}">Сборки</a>
        
        <a class="px-4 py-2 rounded-xl transition-all hover:text-indigo-600 {% if 'consumable' in request.resolver_match.url_name %}bg-slate-100 text-indigo-600 shadow-inner{% endif %}" href="{% url 'consumable_list' %}">Кастом</a>
        
        <a class="px-4 py-2 rounded-xl transition-all hover:text-indigo-600 {% if 'purchase' in request.resolver_match.url_name %}bg-slate-100 text-indigo-600 shadow-inner{% endif %}" href="{% url 'purchase_list' %}">Купить</a>

        <a class="px-4 py-2 rounded-xl transition-all hover:text-indigo-600 {% if 'sale' in request.resolver_match.url_name %}bg-slate-100 text-indigo-600 shadow-inner{% endif %}" href="{% url 'sale_list' %}">Продажи</a>
        
        <div class="w-px h-4 bg-slate-200 mx-2"></div>
        
        <a class="px-4 py-2 rounded-xl transition-all hover:text-indigo-600 {% if 'archive' in request.resolver_match.url_name %}bg-slate-100 text-indigo-600 shadow-inner{% endif %}" href="{% url 'archive_list' %}">Архив</a>
      </nav>
    </header>

    <main class="min-h-[60vh]">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
