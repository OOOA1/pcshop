{% extends "base.html" %}
{% block title %}Конфигурация_сборки{% endblock %}
{% block content %}

<div class="max-w-3xl mx-auto">
  <div class="mb-8 text-center md:text-left">
    <h1 class="text-3xl font-black text-slate-900 uppercase tracking-tighter">
      <span class="text-indigo-600">></span> Build_Project_Init
    </h1>
    <p class="text-slate-500 font-mono text-[10px] mt-1 uppercase">/root/builds/config_wizard</p>
  </div>

  <div class="bg-white rounded-3xl border border-slate-100 shadow-2xl overflow-hidden">
    <div class="bg-slate-900 px-6 py-3 flex items-center justify-between border-b border-slate-800">
      <span class="text-[10px] font-mono text-slate-500 font-bold uppercase tracking-widest italic">System_Output: enter_data</span>
      <div class="flex gap-1.5">
        <div class="w-2 h-2 rounded-full bg-slate-700"></div>
        <div class="w-2 h-2 rounded-full bg-slate-700"></div>
        <div class="w-2 h-2 rounded-full bg-indigo-500"></div>
      </div>
    </div>

    <form method="post" enctype="multipart/form-data" class="p-8 space-y-6">
      {% csrf_token %}
      
      <div class="space-y-4">
        {{ form.as_p }}
      </div>

      <div class="pt-6 border-t border-slate-50 flex items-center justify-between gap-4">
        <a href="{% url 'build_list' %}" class="text-xs font-bold text-slate-400 hover:text-slate-600 uppercase font-mono">Abort_Process</a>
        <button type="submit" class="px-10 py-4 bg-indigo-600 text-white rounded-2xl font-black text-xs uppercase hover:bg-indigo-700 transition-all shadow-xl shadow-indigo-100">
          Commit_Changes [Загрузить]
        </button>
      </div>
    </form>
  </div>
</div>

<style>
  p { margin-bottom: 1.5rem; }
  label { display: block; font-family: ui-monospace, monospace; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8; margin-bottom: 0.5rem; }
  input, select, textarea { 
    width: 100%; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 1rem; 
    padding: 0.875rem 1.25rem; font-family: ui-monospace, monospace; font-size: 14px; outline: none; transition: all 0.2s;
  }
  input:focus { border-color: #4f46e5; background: white; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
</style>

{% endblock %}
